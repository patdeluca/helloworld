<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World — America's National Parks</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <section class="hero" id="hero">
    <div class="hero__slideshow" id="slideshow"></div>
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <p class="hero__eyebrow">Welcome to the world</p>
      <h1 class="hero__title">Hello, <span class="hero__accent">World</span></h1>
      <p class="hero__subtitle">Explore America's most breathtaking national parks</p>
      <a href="#parks" class="hero__cta">Discover the Parks</a>
    </div>
    <div class="hero__scroll-hint"><span></span></div>
  </section>

  <section class="parks" id="parks">
    <header class="parks__header">
      <h2>America's Crown Jewels</h2>
      <p>Six iconic landscapes that define the American wilderness</p>
    </header>
    <div class="parks__grid" id="parksGrid"></div>
  </section>

  <footer class="footer">
    <p>
      Photos courtesy of
      <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>
      photographers &amp; the
      <a href="https://www.nps.gov" target="_blank" rel="noopener">National Park Service</a>.
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
